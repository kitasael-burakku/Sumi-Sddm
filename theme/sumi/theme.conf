; Sumi SDDM — valores por defecto.
;
; SDDM carga este archivo y después «theme.conf.user» (mismo directorio), que lo sobrescribe:
; pon tus cambios ahí, no aquí. Todas las claves son opcionales: el tema tiene los mismos
; valores compilados y descarta (vuelve al valor por defecto) cualquier valor inválido; los
; números fuera de rango se acotan.
;
; Formato: INI de QSettings, sólo la sección [General]. Entrecomilla los valores que contengan
; comas, «;» o «#» (QSettings convierte «a, b» en una lista y «;» empieza un comentario).

[General]

; ── Fondo ──────────────────────────────────────────────────────────────────────────────
; Imagen de fondo. Vacío = fondo «tinta» generado en QML (no necesita archivos).
; Ruta absoluta o relativa al directorio del tema (sin «..»). Debe ser legible por el
; usuario «sddm»: una imagen dentro de $HOME normalmente NO lo es.
background=
; Encaje de la imagen: crop (llenar recortando) | fit (completa, con bandas) | stretch
backgroundFill=crop
; Desenfoque de la imagen, 0–100 (0 = sin desenfoque). No se aplica al fondo generado.
blurRadius=0
; Oscurecimiento sobre el fondo, 0.0–0.85
dimOpacity=0.2
; Color base (visible mientras carga la imagen o si falla)
backgroundColor="#0c0d10"

; ── Colores ────────────────────────────────────────────────────────────────────────────
; Formato #RRGGBB o #AARRGGBB
accentColor="#a9bdff"
textColor="#f3f3f5"
errorColor="#ff8f87"
notchColor="#000000"
fieldColor="#1c1c1f"

; ── Tipografía y escala ────────────────────────────────────────────────────────────────
; Familia. Vacío = Inter incluida en el tema (assets/fonts).
fontFamily=
; Escala global de la interfaz, 0.5–2.0 (además del ajuste automático a la resolución)
uiScale=1.0

; ── Notch ──────────────────────────────────────────────────────────────────────────────
; Medidas en píxeles de referencia (pantalla 1920×1080; se escalan con la resolución)
notchCompactWidth=200
notchCompactHeight=34
notchExpandedWidth=440
; Radio de las esquinas inferiores, 4–48
notchRadius=22
; Curva de unión con el borde superior («hombros»), 0–24 (0 = sin curva)
notchShoulder=12
; true = empieza expandida; false = compacta (escribir la expande igualmente)
notchStartExpanded=false
; Segundos sin actividad para recogerse y borrar la contraseña escrita, 0 o 5–600 (0 = nunca)
notchIdleCollapse=60

; ── Reloj ──────────────────────────────────────────────────────────────────────────────
; center | top-left | top-right | bottom-left | bottom-right
clockPosition=center
; 24h | 12h
clockFormat=24h
clockSeconds=false
; Tamaño relativo, 0.5–2.0
clockScale=1.0
; Formato de fecha de Qt (https://doc.qt.io/qt-6/qml-qtqml-qt.html#formatDateTime-method)
dateFormat="dddd, d MMMM"

; ── Usuarios ───────────────────────────────────────────────────────────────────────────
; always | auto (oculta el selector con un solo usuario) | never
userStrip=always
; Diámetro del avatar, 40–120
avatarSize=64
; Entrada manual de usuario: auto (sólo si SDDM no lista usuarios) | always | never
manualUser=auto

; ── Energía ────────────────────────────────────────────────────────────────────────────
; Cada acción pide confirmación siempre; sólo aparece si SDDM la declara disponible.
showShutdown=true
showRestart=true
showSuspend=false

; ── Movimiento ─────────────────────────────────────────────────────────────────────────
animations=true
; Multiplicador de velocidad, 0.25–3.0 (2.0 = el doble de rápido)
animationSpeed=1.0

; ── Varios ─────────────────────────────────────────────────────────────────────────────
; Con varios monitores: all (inicio de sesión en todos) | primary (los demás sólo fondo y reloj)
multiMonitor=all
; Segundos de espera a la respuesta del inicio de sesión antes de reactivar el formulario, 5–120
authTimeout=30
