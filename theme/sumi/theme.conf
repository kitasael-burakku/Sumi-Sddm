; Sumi SDDM — valores por defecto. Generado por tools/sumi-sddm gen desde schema/config-schema.json. No editar a mano.
;
; SDDM carga este archivo y después «theme.conf.user» (mismo directorio), que lo sobrescribe:
; las personalizaciones van ahí (o con `sumi-sddm config set`), nunca aquí. Todas las claves son
; opcionales: el tema tiene los mismos valores compilados, descarta los inválidos y acota los
; números fuera de rango.
;
; Formato: INI de QSettings, sólo [General]. Los textos van entre comillas: QSettings convierte
; «a, b» en una lista y «;» empieza un comentario.

[General]

; ── Fondo ───────────────────────────────────────────────────────────────────────────────
; Imagen de fondo. Vacío = fondo «tinta» generado en QML. Ruta relativa al tema (backgrounds/…) o absoluta bajo /usr/share; debe ser legible por el usuario «sddm». Con `sumi-sddm wallpaper set` se gestiona sola. [ruta (jpg, jpeg, png, webp)]
background=""
; Encaje de la imagen: crop (llenar recortando), fit (completa, con bandas), stretch. [crop | fit | stretch]
backgroundFill=crop
; Desenfoque del wallpaper, 0–100 (0 = nada). No se aplica al fondo generado ni con el renderizador software. [0–100]
blurRadius=0
; Oscurecimiento sobre el fondo, 0–0.85. [0–0.85]
dimOpacity=0.2
; Color base, visible mientras carga la imagen o si falla. [#RRGGBB | #AARRGGBB]
backgroundColor="#0c0d10"

; ── Colores ─────────────────────────────────────────────────────────────────────────────
; Acento: anillos de foco, botón de enviar. [#RRGGBB | #AARRGGBB]
accentColor="#a9bdff"
; Texto principal (los secundarios son este color con transparencia). [#RRGGBB | #AARRGGBB]
textColor="#f3f3f5"
; Mensajes de error y botón de confirmación de energía. [#RRGGBB | #AARRGGBB]
errorColor="#ff8f87"
; Relleno de la notch. [#RRGGBB | #AARRGGBB]
notchColor="#000000"
; Campos y botones dentro de la notch. [#RRGGBB | #AARRGGBB]
fieldColor="#1c1c1f"

; ── Tipografía y escala ─────────────────────────────────────────────────────────────────
; Familia tipográfica instalada en el sistema. Vacío = Inter incluida en el tema. [texto (máx. 64)]
fontFamily=""
; Escala global, además del ajuste automático a la resolución, 0.5–2. [0.5–2.0]
uiScale=1
; Tamaño del texto de la notch, botones y nombres, 0.75–1.5 (el reloj usa clockScale). [0.75–1.5]
fontScale=1

; ── Notch ───────────────────────────────────────────────────────────────────────────────
; Ancho de la notch compacta, en píxeles de referencia (1920×1080). [120–480]
notchCompactWidth=200
; Alto de la notch compacta. [24–64]
notchCompactHeight=34
; Ancho de la notch expandida (el alto depende del contenido). [340–720]
notchExpandedWidth=440
; Radio de las esquinas inferiores. [4–48]
notchRadius=22
; Curva de unión con el borde superior (0 = sin curva). [0–24]
notchShoulder=12
; true = empieza expandida; false = compacta (escribir la expande igualmente). [true | false]
notchStartExpanded=false
; Segundos sin actividad para recogerse y borrar la contraseña escrita: 0 (nunca) o 5–600. [0 o 5–600]
notchIdleCollapse=60

; ── Reloj ───────────────────────────────────────────────────────────────────────────────
; Posición del reloj. [center | top-left | top-right | bottom-left | bottom-right]
clockPosition=center
; Formato de hora. [24h | 12h]
clockFormat=24h
; Mostrar segundos. [true | false]
clockSeconds=false
; Tamaño relativo del reloj, 0.5–2. [0.5–2.0]
clockScale=1
; Grosor de la hora. [thin | light | regular | medium]
clockWeight=light
; Desplazamiento horizontal fino, en píxeles de referencia. [-600–600]
clockOffsetX=0
; Desplazamiento vertical fino, en píxeles de referencia. [-400–400]
clockOffsetY=0
; Formato de fecha de Qt (https://doc.qt.io/qt-6/qml-qtqml-qt.html#formatDateTime-method). Vacío = por defecto. [texto (máx. 48)]
dateFormat="dddd, d MMMM"

; ── Selector de usuarios ────────────────────────────────────────────────────────────────
; always | auto (se oculta con un solo usuario) | never. [always | auto | never]
userStrip=always
; Diámetro del avatar. [40–120]
avatarSize=64
; Mostrar el nombre bajo cada avatar. [true | false]
userNames=true
; Opacidad de los usuarios no seleccionados. [0.2–1.0]
userInactiveOpacity=0.6
; Distancia al borde inferior. [16–300]
userStripMargin=64
; Entrada manual de usuario: auto (sólo si SDDM no lista usuarios) | always | never. Sin usuarios listados siempre está disponible. [auto | always | never]
manualUser=auto

; ── Energía ─────────────────────────────────────────────────────────────────────────────
; Botón de apagar (sólo si SDDM lo permite; pide confirmación). [true | false]
showShutdown=true
; Botón de reiniciar (ídem). [true | false]
showRestart=true
; Botón de suspender (ídem). [true | false]
showSuspend=false

; ── Movimiento ──────────────────────────────────────────────────────────────────────────
; Activar animaciones. [true | false]
animations=true
; Multiplicador de velocidad: duración = base / velocidad, 0.25–3. [0.25–3.0]
animationSpeed=1

; ── Comportamiento ──────────────────────────────────────────────────────────────────────
; all (inicio de sesión en todas las pantallas) | primary (las demás sólo fondo y reloj). [all | primary]
multiMonitor=all
; Segundos de espera a la respuesta del inicio de sesión antes de reactivar el formulario. [5–120]
authTimeout=30
